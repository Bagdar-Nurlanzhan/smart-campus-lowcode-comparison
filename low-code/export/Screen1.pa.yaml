Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Label1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: |-
              ="Smart Campus A-204 (low-code). Time 09:00. Bookings: " & Concat(nfBookings, Text(RoundDown(StartMin / 60, 0), "00") & ":" & Text(Mod(StartMin, 60), "00") & "-" & Text(RoundDown(EndMin / 60, 0), "00") & ":" & Text(Mod(EndMin, 60), "00"))
            X: =40
            Y: =40
      - TextInput1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HintText: ="Start HH:MM"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =40
            Y: =210
      - TextInput2:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HintText: ="Duration minutes"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            X: =40
            Y: =355
      - Checkbox1:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Font: =Font.'Open Sans'
            HoverColor: =RGBA(0, 18, 107, 1)
            Text: ="Room is blocked"
            Width: =520
            X: =60
            Y: =450
      - Button1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Set(varStart, Trim(TextInput1.Text)); Set(varDurText, Trim(TextInput2.Text)); Set(varValid, IsMatch(varStart, "([01]?[0-9]|2[0-3]):[0-5][0-9]") && IsMatch(varDurText, "-?[0-9]+")); Set(varS, If(varValid, Value(Left(varStart, Find(":", varStart) - 1)) * 60 + Value(Right(varStart, 2)), 0)); Set(varD, If(varValid, Value(varDurText), 0)); Set(varE, varS + varD); Set(varHit, First(Filter(nfBookings, varS < EndMin && varE > StartMin))); Set(varCode, If(!varValid, "INVALID_INPUT", Checkbox1.Value, "BLOCKED", varD <= 0, "INVALID_DURATION", varE > 1440, "OUT_OF_DAY", varS <= 540, "PAST_START", varD > 120, "INVALID_DURATION", !IsBlank(varHit), "OVERLAP", "OK"))
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Check availability"
            Width: =520
            X: =60
            Y: =560
      - Label2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =360
            Text: |-
              =If(IsBlank(varCode), "", If(varCode = "OK", "Available", "Unavailable") & Char(10) & Switch(varCode, "INVALID_INPUT", "Enter a start time as HH:MM and a duration in whole minutes.", "BLOCKED", "Room A-204 is blocked and cannot be used.", "INVALID_DURATION", "Duration must be between 1 and 120 minutes.", "OUT_OF_DAY", "The booking must end by 24:00.", "PAST_START", "Start time must be later than the current time (09:00).", "OVERLAP", "Overlaps an existing booking (" & Text(RoundDown(varHit.StartMin / 60, 0), "00") & ":" & Text(Mod(varHit.StartMin, 60), "00") & "–" & Text(RoundDown(varHit.EndMin / 60, 0), "00") & ":" & Text(Mod(varHit.EndMin, 60), "00") & ").", "Available: room A-204 is free from " & Text(RoundDown(varS / 60, 0), "00") & ":" & Text(Mod(varS, 60), "00") & " to " & Text(RoundDown(varE / 60, 0), "00") & ":" & Text(Mod(varE, 60), "00") & ".") & Char(10) & "[" & varCode & "]")
            X: =60
            Y: =670
